<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SATI 灵魂动物测试</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="SATI 灵魂动物测试">
      <section id="homeScreen" class="screen home-screen is-active" aria-label="首页">
        <nav class="topbar">
          <strong>SATI</strong>
          <button class="text-button" type="button" data-screen="collectionScreen">图鉴</button>
        </nav>

        <div class="hero-card">
          <p class="eyebrow">SOUL ANIMAL TEST INDEX</p>
          <h1>测你今天最像什么动物</h1>
          <p>8 道直觉题，测出你的灵魂动物卡。高分并列时，会生成双卡混合灵魂。</p>
          <div class="hero-orbit" aria-hidden="true">
            <span>🐱</span>
            <span>🦊</span>
            <span>🦉</span>
            <span>🦁</span>
            <span>🐬</span>
          </div>
        </div>

        <div class="stat-grid" aria-label="当前收集进度">
          <article>
            <span>题目</span>
            <strong id="homeQuestionCount">8</strong>
          </article>
          <article>
            <span>图鉴</span>
            <strong><b id="homeUnlockedCount">0</b>/12</strong>
          </article>
        </div>

        <div id="homePreview" class="preview-row" aria-label="已解锁卡片预览"></div>

        <div class="action-stack">
          <button id="startButton" class="primary-button" type="button">开始测试</button>
          <button class="secondary-button" type="button" data-screen="collectionScreen">查看灵魂图鉴</button>
        </div>
      </section>

      <section id="quizScreen" class="screen page-screen" aria-label="SATI 测试题">
        <header class="page-header">
          <button class="icon-button" type="button" data-screen="homeScreen" aria-label="返回首页">‹</button>
          <div>
            <p>SATI SCAN</p>
            <h2>凭第一反应选择</h2>
          </div>
        </header>

        <div class="progress-panel">
          <div>
            <span id="quizProgressText">1 / 8</span>
            <strong id="quizProgressPercent">13%</strong>
          </div>
          <i><b id="quizProgressBar"></b></i>
        </div>

        <article class="question-card">
          <span id="questionCode" class="card-code">Q1</span>
          <h3 id="questionTitle"></h3>
          <div id="optionList" class="option-list" aria-label="选项"></div>
          <p id="answerHint" class="answer-hint" aria-live="polite"></p>
        </article>
      </section>

      <section id="resultScreen" class="screen page-screen" aria-label="测试结果">
        <header class="page-header">
          <button class="icon-button" type="button" data-screen="homeScreen" aria-label="返回首页">‹</button>
          <div>
            <p>REVEAL</p>
            <h2 id="resultHeading">你的灵魂动物卡</h2>
          </div>
        </header>

        <section class="result-stage">
          <p id="resultSubline" class="result-subline"></p>
          <div id="resultCards" class="result-cards"></div>
        </section>

        <section class="detail-card">
          <div class="section-title">
            <span>Part 1</span>
            <strong>灵魂速写</strong>
          </div>
          <div id="partOne" class="reading-list"></div>
        </section>

        <section class="detail-card">
          <div class="section-title">
            <span>Part 2</span>
            <strong>深度解析</strong>
          </div>
          <button id="unlockDeepButton" class="secondary-button compact" type="button">点击解锁灵魂暗码</button>
          <div id="partTwo" class="reading-list is-locked"></div>
        </section>

        <div class="action-stack">
          <button id="openCollectionButton" class="primary-button" type="button">查看图鉴</button>
          <button id="shareButton" class="secondary-button" type="button">复制结果文案</button>
          <button id="retryButton" class="ghost-button" type="button">再测一次</button>
        </div>
      </section>

      <section id="collectionScreen" class="screen page-screen" aria-label="灵魂图鉴">
        <header class="page-header">
          <button class="icon-button" type="button" data-screen="homeScreen" aria-label="返回首页">‹</button>
          <div>
            <p>COLLECTION</p>
            <h2>灵魂动物图鉴</h2>
          </div>
        </header>

        <div class="collection-summary">
          <strong id="collectionProgress">0 / 12</strong>
          <span>已解锁卡片会保存在本机浏览器里</span>
        </div>

        <div id="collectionGrid" class="collection-grid"></div>

        <div class="action-stack">
          <button id="collectionStartButton" class="primary-button" type="button">继续测试</button>
        </div>
      </section>
    </main>

    <script src="./sati-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
